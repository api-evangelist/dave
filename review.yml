    status: 200
  - type: PrivacyPolicy
    url: https://dave.com/privacy
    status: 200
  - type: Support
    url: https://support.dave.com/hc/en-us
    status: 403 (live Zendesk help center; bot-blocked to automated probe)
  - type: GitHubOrganization
    url: https://github.com/dave-inc
    status: 200
  - type: LinkedIn
    url: https://www.linkedin.com/company/dave-inc
    status: 999 (LinkedIn bot-block; page is real)
  - type: StatusPage
    url: https://status.dave.com
    status: 000 (no public status page found)
conclusion: >-
  Honest representation retained: Dave is profiled as a company with zero first-party public
  APIs. No apis[] entries were fabricated and no specs were invented. The deepening here is the
  verified aggregator-only open-finance posture, the confirmed private-backend vs. developer-portal
  distinction, and the verified identity/link surface (GitHub org and LinkedIn added).
