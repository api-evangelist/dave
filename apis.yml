aid: dave
name: Dave
kind: company
description: 'Dave is a U.S. consumer financial-technology company (Nasdaq: DAVE), founded in 2016
  and headquartered in Los Angeles, that operates a mobile banking app serving roughly 14 million
  members. Its products include ExtraCash short-term cash advances of up to $500 (underwritten with
  its CashAI cash-flow model rather than credit scores), an FDIC-insured Dave Checking account with
  early direct deposit and Round-Up savings, and a Goals savings account. Banking services are
  provided through partner banks such as Coastal Community Bank. Dave is a consumer app and does not
  publish a first-party public developer API, SDKs, or a developer portal: there is no
  developer.dave.com / docs.dave.com, and api.dave.com is the app''s private, undocumented mobile
  backend. Programmatic access to Dave-held consumer data is aggregator-mediated — Dave both consumes
  Plaid (to let members link external accounts) and is reachable as a supported institution through
  open-finance aggregators. This profile captures its public identity, aggregator-only open-finance
  posture, commercial link surface, and domain-security posture.'
